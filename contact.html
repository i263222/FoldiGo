<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldiGo - Contact & Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: pink;">
    <header>
        <h1>FoldiGO</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="how-it-works.html">How It Works</a> | 
            <a href="about.html">About Us</a> | 
            <a href="contact.html">Order / Contact</a>
        </nav>
    </header>

    <main>
        <h2>ORDER YOUR FOLDIGO</h2>
        <p class="oblique-text">Select your bag size and place an order request below:</p>

        <form id="orderForm" onsubmit="event.preventDefault(); submitOrder();">
            <p>Name: <input type="text" id="custName" required></p>
            <p>Size: 
                <select id="bagSize">
                    <option value="Small (Rs 50)">Small - Rs 50</option>
                    <option value="Medium (Rs 70)">Medium - Rs 70</option>
                    <option value="Large (Rs 120)">Large - Rs 120</option>
                </select>
            </p>
            <button type="submit">Submit Order Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 FoldiGo Inc. | Huma Yaseen (26i-3222) - Section A</p>
    </footer>

    <script>
        function submitOrder() {
            const name = document.getElementById('custName').value;
            const size = document.getElementById('bagSize').value;
            console.log("Order Received from: " + name + " for size: " + size);
            alert("Order submitted for " + name + " (" + size + ")! Check browser console for confirmation.");
        }
    </script>
</body>
</html>
